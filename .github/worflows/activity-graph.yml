name: Generate Profile Graphs

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Naman105
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Naman105
          options: theme=tokyo-night&hide_border=true&bg_color=0d1117
          output_path: dist/github-contribution-grid-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -la dist

      - name: Publish Graphs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
