name: Generate Activity Graph

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Naman105
          options: theme=tokyo-night&hide_border=true&bg_color=0d1117
          output_path: dist/github-contribution-grid-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Activity Graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
