name: Profile Graphs

on:
  schedule:
    - cron: "0 0 * * *"      # once a day, midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Naman105
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Naman105
          options: theme=tokyo-night&hide_border=true&bg_color=0d1117
          output_path: dist/github-contribution-grid-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
